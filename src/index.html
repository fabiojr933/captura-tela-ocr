<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print & OCR App</title>
  <link href="./output.css" rel="stylesheet">
  <style>
    .tool-btn.active {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
      border-color: #6366f1 !important;
    }

    #editor-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    #main-card {
      max-width: 28rem;
      padding: 1.5rem;
      gap: 1.25rem;
    }

    #editor-modal.hidden {
      display: none;
    }

    #editor-canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: none;
    }

    #editor-workspace {
      position: relative;
    }

    #text-input-overlay {
      position: absolute;
      display: none;
      z-index: 2;
      min-width: 220px;
      padding: 8px 10px;
      color: #0f172a;
      background: #ffffff;
      border: 2px solid #6366f1;
      border-radius: 8px;
      outline: none;
      font: 600 16px sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans select-none relative">
  
  <!-- Container Principal Compacto -->
  <div id="main-card" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
    
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-indigo-500/10 text-indigo-400 rounded-2xl border border-indigo-500/20">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Captura de Tela & OCR</h1>
      <p class="text-slate-400 text-xs">Selecione uma área para copiar a imagem ou transcrever o texto.</p>
    </div>

    <!-- Botoes de Acao -->
    <div class="grid grid-cols-2 gap-3">
      <button id="btn-capture-img" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-xs font-semibold rounded-2xl shadow-lg shadow-indigo-600/20 transition-all duration-200 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>Capturar Imagem</span>
      </button>

      <button id="btn-capture-ocr" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white text-xs font-semibold rounded-2xl shadow-lg shadow-emerald-600/20 transition-all duration-200 cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>Extrair Texto (OCR)</span>
      </button>
    </div>

    <!-- Status da Operacao -->
    <div id="status" class="hidden transition-all duration-300 ease-out text-xs p-4 rounded-2xl border text-left flex items-start gap-3"></div>

    <!-- Container de Texto OCR -->
    <div id="text-container" class="hidden space-y-2 border-t border-slate-800 pt-4 text-left">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span class="font-semibold text-slate-200">Texto Transcrito</span>
        <button id="btn-copy-text" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-[11px] font-medium transition-colors flex items-center gap-1.5 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          <span id="btn-copy-label">Copiar Texto</span>
        </button>
      </div>
      <textarea id="ocr-textarea" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50 resize-y font-mono leading-relaxed"></textarea>
    </div>

    <!-- Container de Preview da Captura -->
    <div id="preview-container" class="hidden space-y-2 border-t border-slate-800 pt-4 text-left">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span class="font-semibold text-slate-200">Pré-visualização</span>
        <div class="flex items-center gap-2">
          <button id="btn-edit-image" class="text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full font-medium text-xs hover:bg-indigo-500/20 transition-all cursor-pointer flex items-center gap-1">
            ✏️ Editar / Desenhar
          </button>
          <span id="badge-clipboard" class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full font-medium text-[10px]">Copiado</span>
        </div>
      </div>
      <div id="preview-wrapper" class="group relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 p-2 cursor-pointer hover:border-slate-700 transition-colors">
        <img id="preview-img" class="w-full max-h-56 object-contain rounded-xl block" alt="Preview da captura" />
      </div>
    </div>

  </div>

  <!-- Modal do Editor em Tela Cheia -->
  <div id="editor-modal" class="hidden fixed inset-0 w-screen h-screen bg-slate-950 z-50 flex flex-col overflow-hidden">
    
    <!-- Header do Editor -->
    <div class="flex items-center justify-between px-6 py-3 border-b border-slate-800 bg-slate-900 shrink-0">
      <div class="flex items-center gap-3">
        <span class="text-sm font-semibold text-slate-100">Editor de Anotações</span>
        <span class="text-xs text-slate-500">Modo Tela Cheia</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-editor-undo" title="Desfazer" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition-colors cursor-pointer flex items-center gap-1">
          ↩️ Desfazer
        </button>
        <button id="btn-editor-clear" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition-colors cursor-pointer">
          🗑️ Limpar Tudo
        </button>
        <button id="btn-editor-close" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition-colors cursor-pointer">
          Cancelar
        </button>
        <button id="btn-editor-save" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs shadow-lg shadow-indigo-600/20 transition-all cursor-pointer">
          💾 Salvar Edição
        </button>
      </div>
    </div>

    <!-- Interface Principal do Editor -->
    <div class="flex-1 flex overflow-hidden">
      
      <!-- Sidebar de Ferramentas -->
      <div class="w-60 border-r border-slate-800 p-4 bg-slate-900/50 flex flex-col gap-5 overflow-y-auto shrink-0">
        <div>
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase block mb-2">Ferramentas</span>
          <div class="grid grid-cols-1 gap-1.5">
            <button id="tool-pen" data-tool="pen" class="tool-btn active flex items-center gap-2.5 px-3 py-2 bg-slate-800/60 border border-slate-700/50 rounded-xl text-xs text-slate-200 hover:bg-slate-800 transition-colors cursor-pointer">
              <span>✒️</span> Caneta
            </button>
            <button id="tool-highlighter" data-tool="highlighter" class="tool-btn flex items-center gap-2.5 px-3 py-2 bg-slate-800/60 border border-slate-700/50 rounded-xl text-xs text-slate-200 hover:bg-slate-800 transition-colors cursor-pointer">
              <span>🖍️</span> Marca-Texto
            </button>
            <button id="tool-rect" data-tool="rect" class="tool-btn flex items-center gap-2.5 px-3 py-2 bg-slate-800/60 border border-slate-700/50 rounded-xl text-xs text-slate-200 hover:bg-slate-800 transition-colors cursor-pointer">
              <span>🔲</span> Retângulo
            </button>
            <button id="tool-arrow" data-tool="arrow" class="tool-btn flex items-center gap-2.5 px-3 py-2 bg-slate-800/60 border border-slate-700/50 rounded-xl text-xs text-slate-200 hover:bg-slate-800 transition-colors cursor-pointer">
              <span>↘️</span> Seta
            </button>
            <button id="tool-text" data-tool="text" class="tool-btn flex items-center gap-2.5 px-3 py-2 bg-slate-800/60 border border-slate-700/50 rounded-xl text-xs text-slate-200 hover:bg-slate-800 transition-colors cursor-pointer">
              <span>💬</span> Inserir Texto
            </button>
          </div>
        </div>

        <div>
          <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase block mb-2">Cor do Traço</span>
          <div class="flex items-center gap-2">
            <input type="color" id="editor-color" value="#ef4444" class="w-10 h-10 rounded-xl cursor-pointer bg-slate-800 border border-slate-700 p-0.5">
            <div id="color-presets" class="flex gap-1.5">
              <button data-color="#ef4444" class="w-6 h-6 rounded-full bg-red-500 border border-white/20 cursor-pointer"></button>
              <button data-color="#eab308" class="w-6 h-6 rounded-full bg-yellow-500 border border-white/20 cursor-pointer"></button>
              <button data-color="#22c55e" class="w-6 h-6 rounded-full bg-green-500 border border-white/20 cursor-pointer"></button>
              <button data-color="#3b82f6" class="w-6 h-6 rounded-full bg-blue-500 border border-white/20 cursor-pointer"></button>
            </div>
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase">Espessura</span>
            <span id="line-width-label" class="text-xs text-slate-300">3px</span>
          </div>
          <input type="range" id="line-width" min="1" max="25" value="3" class="w-full accent-indigo-500 cursor-pointer">
        </div>
      </div>

      <!-- Area do Canvas no Editor -->
      <div id="editor-workspace" class="flex-1 min-w-0 min-h-0 bg-slate-950 p-6 flex items-center justify-center overflow-auto relative">
        <canvas id="editor-canvas" class="max-w-full max-h-full rounded-xl shadow-2xl cursor-crosshair border border-slate-800/80"></canvas>
        <input id="text-input-overlay" type="text" placeholder="Digite o texto e pressione Enter" />
      </div>

    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
