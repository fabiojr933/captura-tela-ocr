<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print & OCR App</title>
<link href="./output.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans select-none">
  
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 bg-indigo-500/10 text-indigo-400 rounded-2xl border border-indigo-500/20">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Captura de Tela & OCR</h1>
      <p class="text-slate-400 text-xs">Selecione uma área para copiar a imagem ou transcrever o texto.</p>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button id="btn-capture-img" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white text-xs font-semibold rounded-2xl shadow-lg shadow-indigo-600/20 transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>Capturar Imagem</span>
      </button>

      <button id="btn-capture-ocr" class="flex items-center justify-center gap-2 py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] text-white text-xs font-semibold rounded-2xl shadow-lg shadow-emerald-600/20 transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span>Extrair Texto (OCR)</span>
      </button>
    </div>

    <div id="status" class="hidden transition-all duration-300 ease-out text-xs p-4 rounded-2xl border text-left flex items-start gap-3"></div>

    <div id="text-container" class="hidden space-y-2 border-t border-slate-800 pt-4 text-left">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span class="font-semibold text-slate-200">Texto Transcrito</span>
        <button id="btn-copy-text" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-[11px] font-medium transition-colors flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
          </svg>
          <span id="btn-copy-label">Copiar Texto</span>
        </button>
      </div>
      <textarea id="ocr-textarea" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500/50 resize-y font-mono leading-relaxed"></textarea>
    </div>

    <div id="preview-container" class="hidden space-y-2 border-t border-slate-800 pt-4 text-left">
      <div class="flex items-center justify-between text-xs text-slate-400">
        <span class="font-semibold text-slate-200">Pré-visualização</span>
        <span id="badge-clipboard" class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full font-medium text-[10px]">Copiado (Ctrl+V)</span>
      </div>
      <div id="preview-wrapper" title="Clique para abrir no visualizador de arquivos" class="group relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 p-2 cursor-pointer hover:border-slate-700 transition-colors">
        <img id="preview-img" class="w-full max-h-48 object-contain rounded-xl" alt="Preview da captura" />
      </div>
    </div>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
