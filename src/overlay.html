<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Overlay de Captura</title>
  <style>
    :root {
      /* 🎨 ALTERE AS CORES DA BORDA AQUI */
      --border-primary: #06b6d4;             /* Cor principal */
      --border-pulse: #3b82f6;               /* Cor do brilho ao pulsar */
      --border-glow: rgba(6, 182, 212, 0.5); /* Brilho neon interno */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
    }

    /* Borda em toda a tela */
    .screen-border {
      position: fixed;
      inset: 0;
      border: 4px solid var(--border-primary);
      box-shadow: inset 0 0 20px var(--border-glow);
      pointer-events: none;
      z-index: 9999;
      animation: pulse-border 2s infinite ease-in-out;
    }

    @keyframes pulse-border {
      0%, 100% {
        border-color: var(--border-primary);
        box-shadow: inset 0 0 12px var(--border-glow);
      }
      50% {
        border-color: var(--border-pulse);
        box-shadow: inset 0 0 22px var(--border-glow);
      }
    }

    /* Badge no topo com atalhos */
    .instruction-badge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 8px 20px;
      border-radius: 9999px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 9998;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Borda neon em toda a tela -->
  <div class="screen-border"></div>

  <!-- Tag informativa -->
  <div class="instruction-badge">
    ✂️ Clique e arraste para selecionar a área • Pressione <strong>ESC</strong> para cancelar
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Pega a cor principal definida no CSS para a caixa de seleção do mouse
    const primaryColor = getComputedStyle(document.documentElement)
      .getPropertyValue('--border-primary').trim() || '#06b6d4';

    let bgImage = new Image();
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;

    window.electronAPI.onInitOverlay((data) => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      bgImage.onload = () => {
        drawOverlay();
      };
      bgImage.src = data.imageUri;
    });

    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      }

      // Escurece o fundo
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Área recortada pelo mouse
      if (isDrawing) {
        const x = Math.min(startX, currentX);
        const y = Math.min(startY, currentY);
        const w = Math.abs(currentX - startX);
        const h = Math.abs(currentY - startY);

        if (w > 0 && h > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.clip();
          ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
          ctx.restore();

          // Retângulo de seleção na mesma cor da borda
          ctx.strokeStyle = primaryColor;
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, w, h);

          // Tag de dimensões (L x A)
          ctx.fillStyle = primaryColor;
          ctx.fillRect(x, Math.max(0, y - 22), 90, 20);
          ctx.fillStyle = '#ffffff';
          ctx.font = '11px sans-serif';
          ctx.fillText(`${Math.round(w)} x ${Math.round(h)} px`, x + 6, Math.max(14, y - 8));
        }
      }
    }

    window.addEventListener('mousedown', (e) => {
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      currentX = e.clientX;
      currentY = e.clientY;
      drawOverlay();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      currentX = e.clientX;
      currentY = e.clientY;
      drawOverlay();
    });

    window.addEventListener('mouseup', async (e) => {
      if (!isDrawing) return;
      isDrawing = false;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      if (width > 10 && height > 10) {
        await window.electronAPI.cropAndSave({ x, y, width, height });
      } else {
        drawOverlay();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electronAPI.cancelCapture();
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawOverlay();
    });
  </script>
</body>
</html>
