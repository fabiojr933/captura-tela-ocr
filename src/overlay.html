<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Overlay de Captura</title>
  <style>
    :root {
      --border-primary: #06b6d4;
      --border-pulse: #3b82f6;
      --border-glow: rgba(6, 182, 212, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.01); /* Força o Chromium a capturar eventos de ponteiro */
      cursor: crosshair;
      pointer-events: auto;
    }

    .screen-border {
      position: fixed;
      inset: 0;
      border: 4px solid var(--border-primary);
      box-shadow: inset 0 0 20px var(--border-glow);
      pointer-events: none !important;
      z-index: 9999;
      animation: pulse-border 2s infinite ease-in-out;
    }

    @keyframes pulse-border {
      0%, 100% {
        border-color: var(--border-primary);
        box-shadow: inset 0 0 12px var(--border-glow);
      }
      50% {
        border-color: var(--border-pulse);
        box-shadow: inset 0 0 22px var(--border-glow);
      }
    }

    .instruction-badge {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 8px 20px;
      border-radius: 9999px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.15);
      pointer-events: none !important;
      z-index: 9998;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="screen-border"></div>

  <div class="instruction-badge">
    ✂️ Clique e arraste para selecionar a área • Pressione <strong>ESC</strong> para cancelar
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const primaryColor = getComputedStyle(document.documentElement)
      .getPropertyValue('--border-primary').trim() || '#06b6d4';

    let bgImage = new Image();
    let isDrawing = false;
    let startX = 0, startY = 0, currentX = 0, currentY = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    // Registra o evento recebido via IPC exposto no preload.js
    window.electronAPI.onInitOverlay((data) => {
      resizeCanvas();
      bgImage.onload = () => drawOverlay();
      bgImage.src = data.imageUri;
    });

    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Renderiza a imagem de fundo capturada
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      }

      // Máscara escura semi-transparente
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isDrawing) {
        const x = Math.min(startX, currentX);
        const y = Math.min(startY, currentY);
        const w = Math.abs(currentX - startX);
        const h = Math.abs(currentY - startY);

        if (w > 0 && h > 0) {
          // Recorta e mostra a imagem original na área selecionada
          ctx.save();
          ctx.beginPath();
          ctx.rect(x, y, w, h);
          ctx.clip();
          ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
          ctx.restore();

          // Desenha a borda da seleção
          ctx.strokeStyle = primaryColor;
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, w, h);

          // Badge com as dimensões da seleção
          ctx.fillStyle = primaryColor;
          ctx.fillRect(x, Math.max(0, y - 22), 90, 20);
          ctx.fillStyle = '#ffffff';
          ctx.font = '11px sans-serif';
          ctx.fillText(`${Math.round(w)} x ${Math.round(h)} px`, x + 6, Math.max(14, y - 8));
        }
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      currentX = e.clientX;
      currentY = e.clientY;
      drawOverlay();
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      currentX = e.clientX;
      currentY = e.clientY;
      drawOverlay();
    });

    window.addEventListener('pointerup', async (e) => {
      if (!isDrawing) return;
      isDrawing = false;

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const width = Math.abs(currentX - startX);
      const height = Math.abs(currentY - startY);

      if (width > 10 && height > 10) {
        // Envia as coordenadas considerando o fator de escala de telas High-DPI / Retinal
        const scale = window.devicePixelRatio || 1;
        await window.electronAPI.cropAndSave({
          x: Math.round(x * scale),
          y: Math.round(y * scale),
          width: Math.round(width * scale),
          height: Math.round(height * scale)
        });
      } else {
        drawOverlay();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.electronAPI.cancelCapture();
      }
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      drawOverlay();
    });
  </script>
</body>
</html>
